services:
  postgres:
    image: postgres:16-alpine
    container_name: coursereg_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coursereg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coursereg_password}
      POSTGRES_DB: ${POSTGRES_DB:-coursereg_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coursereg} -d ${POSTGRES_DB:-coursereg_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coursereg_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
